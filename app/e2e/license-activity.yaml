# M6 flow (§4 M6 "Done when"): seeds demo data, sets the compliance profile
# to Sweden (the emulator's default system locale is English, so the
# locale-based default is 'none' — the flow selects 'se' explicitly in
# Settings to exercise license activity), then asserts the Home License Activity
# chip, the per-firearm License Activity card on the firearm detail screen,
# and the Stats Custom period range being applied. No inputText (CLAUDE.md
# Maestro gotchas note) — navigation, taps on fixed labels/testIDs, and the
# native Android date-picker's own OK button (tapped by visible text) only.
appId: app.shotledger
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Home'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'settle-before-open-link'
    timeout: 4000
    optional: true
- openLink: 'shotledger://dev'
- extendedWaitUntil:
    visible: 'Dev'
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: 'Dev'
    commands:
      - openLink: 'shotledger://dev'
- extendedWaitUntil:
    visible: 'Dev'
    timeout: 15000
- tapOn:
    id: 'load-demo-data'
- openLink: 'shotledger://'
- extendedWaitUntil:
    visible: 'Home'
    timeout: 15000

# --- Settings: select the Sweden compliance profile ---------------------
- tapOn: 'Settings'
# Settings is a menu of drill-downs; the profile picker lives one page in.
- extendedWaitUntil:
    visible:
      id: 'settings-open-compliance'
    timeout: 15000
- tapOn:
    id: 'settings-open-compliance'
- extendedWaitUntil:
    visible:
      id: 'compliance-profile-picker'
    timeout: 15000
- tapOn: 'Sweden (FAP 551-3)'
# The Swedish profile is verified, so no unverified-defaults hint; it offers
# the FAP 551-3 5 § / 6 § case and cites its source.
- scrollUntilVisible:
    element:
      id: 'compliance-case-picker'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'compliance-source'
    direction: DOWN
    timeout: 15000
- takeScreenshot: license-activity-01-settings-compliance
# Back out of the drill-down before the tab bar is used again.
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: 'settings-open-compliance'
    timeout: 15000

# --- Home: overall License Activity chip visible --------------------------------
# Not tapOn 'Home': it can match Android's own Home button and leave the app.
- openLink: 'shotledger://'
- extendedWaitUntil:
    visible:
      id: 'home-license-check'
    timeout: 15000
- takeScreenshot: license-activity-02-home-license-activity

# --- Firearms tab / firearm detail: per-firearm License Activity --------
- tapOn: 'Firearms'
- extendedWaitUntil:
    visible: 'CZ Tactical Sport 2 Orange'
    timeout: 15000
- tapOn: 'CZ Tactical Sport 2 Orange'
- extendedWaitUntil:
    visible: 'License Activity'
    timeout: 15000
- takeScreenshot: license-activity-03-firearm-detail-license-activity
- pressKey: Back
- extendedWaitUntil:
    visible: 'Firearms'
    timeout: 15000

# --- Stats: Custom period, set in the Filter Bar's sheet ----------------
- tapOn: 'Statistics'
- extendedWaitUntil:
    visible:
      id: 'stats-filter-bar-open'
    timeout: 15000
- tapOn:
    id: 'stats-filter-bar-open'
- tapOn: 'Custom'
- extendedWaitUntil:
    visible:
      id: 'stats-custom-from'
    timeout: 15000
- takeScreenshot: license-activity-04-stats-custom-empty
- tapOn:
    id: 'stats-custom-from'
- extendedWaitUntil:
    visible: 'OK'
    timeout: 10000
- tapOn: 'OK'
- extendedWaitUntil:
    visible:
      id: 'stats-custom-to'
    timeout: 10000
- tapOn:
    id: 'stats-custom-to'
- extendedWaitUntil:
    visible: 'OK'
    timeout: 10000
- tapOn: 'OK'
- tapOn: 'Close'
# The header names the applied range: "<from> – <to> · <n> sessions".
- extendedWaitUntil:
    visible: '.+ – .+ · .*'
    timeout: 15000
- takeScreenshot: license-activity-05-stats-custom-applied
