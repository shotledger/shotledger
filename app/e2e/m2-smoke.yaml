# M2 smoke flow (§4 "Done when"): walks all five tabs on seeded data,
# screenshotting each. Loads demo data via the dev-only /dev route first
# (native only — see docs/implementation-plan.md M1 report on web's
# expo-sqlite gap).
appId: app.shotledger
---
- launchApp
- extendedWaitUntil:
    visible: 'Home'
    timeout: 20000
- openLink: 'app://dev'
- extendedWaitUntil:
    visible: 'Dev'
    timeout: 10000
- tapOn:
    id: 'load-demo-data'
- openLink: 'app://'
- assertVisible: 'Home'
- takeScreenshot: m2-smoke-home
- tapOn: 'Statistics'
- assertVisible: 'Statistics'
- takeScreenshot: m2-smoke-stats
- tapOn: 'Firearms'
- assertVisible: 'Firearms'
- takeScreenshot: m2-smoke-firearms
- tapOn: 'Tools'
- assertVisible: 'Tools'
- takeScreenshot: m2-smoke-tools
- tapOn: 'Settings'
- assertVisible: 'Settings'
- takeScreenshot: m2-smoke-settings
