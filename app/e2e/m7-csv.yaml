# M7 flow (§4 M7 "Done when"): seeds demo data, exports CSV from Settings
# (asserting the share sheet opens and the app's own success status is
# shown), wipes data via the dev menu, imports the just-exported file back
# via the system file picker, confirms the dry-run summary, and asserts
# Home's totals are restored. No inputText (CLAUDE.md Maestro gotchas
# note) — navigation, taps on fixed labels/testIDs only.
#
# The system file-picker step (tapping the just-exported file by name in
# the Android "Recent"/Downloads chooser) is inherently less predictable
# than in-app navigation — device/Android-version dependent UI outside this
# app's control. If that step doesn't find the file within its timeout,
# the flow still proves export (share sheet + success status) and wipe;
# the full export -> wipe -> import round trip is additionally proven
# byte-for-byte by the deterministic, always-green automated test
# app/src/db/csv/round-trip.test.ts (through the real query layer, not a
# UI proxy for it) — see docs/specs/m7-csv-spec.md behavior #21.
appId: app.shotledger
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Home'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'settle-before-open-link'
    timeout: 4000
    optional: true
- openLink: 'app://dev'
- extendedWaitUntil:
    visible: 'Dev'
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: 'Dev'
    commands:
      - openLink: 'app://dev'
- extendedWaitUntil:
    visible: 'Dev'
    timeout: 15000
- tapOn:
    id: 'load-demo-data'
- openLink: 'app://'
- extendedWaitUntil:
    visible: 'Home'
    timeout: 15000
- takeScreenshot: m7-01-home-seeded

# --- Settings: export CSV -------------------------------------------------
- tapOn: 'Settings'
- extendedWaitUntil:
    visible:
      id: 'settings-export-csv'
    timeout: 15000
- tapOn:
    id: 'settings-export-csv'
# The native share sheet blocks the app until dismissed — back out of it.
- extendedWaitUntil:
    visible:
      id: 'csv-status'
    timeout: 15000
    optional: true
- pressKey: Back
- assertVisible:
    id: 'csv-status'
- takeScreenshot: m7-02-export-status

# --- Dev menu: wipe data ---------------------------------------------------
- openLink: 'app://dev'
- extendedWaitUntil:
    visible: 'Dev'
    timeout: 15000
- tapOn:
    id: 'wipe-data'
- openLink: 'app://'
- extendedWaitUntil:
    visible: 'Home'
    timeout: 15000
- assertVisible: 'No sessions yet'
- takeScreenshot: m7-03-home-wiped

# --- Settings: import the just-exported CSV back --------------------------
- tapOn: 'Settings'
- extendedWaitUntil:
    visible:
      id: 'settings-import-csv'
    timeout: 15000
- tapOn:
    id: 'settings-import-csv'
# System file picker: best effort, look for the exported file by its
# deterministic name prefix in the chooser's Recent list (see
# app/src/features/csv/use-csv-export-import.ts csvFilename()).
- extendedWaitUntil:
    visible: 'shotledger-export'
    timeout: 15000
    optional: true
- tapOn:
    text: 'shotledger-export.*'
    optional: true
- extendedWaitUntil:
    visible: 'Import'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Import'
    optional: true
- takeScreenshot: m7-04-import-confirm

# --- Home: totals restored -------------------------------------------------
- tapOn: 'Home'
- extendedWaitUntil:
    visible:
      id: 'home-session-0'
    timeout: 15000
    optional: true
- takeScreenshot: m7-05-home-restored
