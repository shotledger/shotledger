# Per-file licensing, REUSE specification 3.3. The root LICENSE file is the
# human summary; this file is what `reuse lint` and SPDX tooling read. A later
# table wins over an earlier one for the files both match.
version = 1
SPDX-PackageName = "ShotLedger"
SPDX-PackageSupplier = "Jimisola Laursen"
SPDX-PackageDownloadLocation = "https://github.com/shotledger/shotledger"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jimisola Laursen"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-ShotLedger-AGPL-Permissions"

# The sync protocol and merge rule, which the backend compiles in. Permissive
# so that nothing AGPL enters the Worker bundle (CONTRIBUTING.md, license map).
[[annotations]]
path = "shared/src/sync/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jimisola Laursen"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "backend/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Jimisola Laursen"
SPDX-License-Identifier = "Elastic-2.0"

# Vendored byte-for-byte from AmazingAng/old-coder; see its LICENSE file.
[[annotations]]
path = ".claude/skills/old-coder/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 amazingang"
SPDX-License-Identifier = "MIT"

# Read from here only, never from the file: reuse 6.2's copyright pattern
# backtracks without end on this file's ~2,900-character table rows (#100).
# Same licence as the default above; the file itself carries no header.
[[annotations]]
path = "docs/decisions-log-archive.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Jimisola Laursen"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-ShotLedger-AGPL-Permissions"
