name: CI

on:
  pull_request:
    # ready_for_review: a draft skips CI, so marking it ready has to start a run.
    types: [opened, synchronize, reopened, ready_for_review]
  # The release workflow runs the same checks on the commit it tags.
  workflow_call:

# A force-push supersedes the run it interrupts; letting that run finish only
# spends Actions minutes on a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    # Every workflow takes its runner from the CI_RUNNER repository variable
    # (Settings → Secrets and variables → Actions → Variables), so moving CI
    # between GitHub-hosted and Blacksmith runners is a settings change, not a
    # commit. Unset means ubuntu-latest; for Blacksmith set it to
    # blacksmith-2vcpu-ubuntu-2404. Blacksmith only serves repositories owned
    # by a GitHub organization.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Saved by ci-cache.yml on main; a PR's own saves are invisible to other PRs.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ github.run_id }}
          restore-keys: prettier-

      # eslint's typed lint of the whole repo needs just over 1.85 GB of heap,
      # past what Node picks by default on the runner (it aborted with "heap
      # out of memory" on 2026-10-13); 4 GB leaves room to grow.
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Not part of `pnpm check` (see CLAUDE.md, "Backend").
      - name: Backend tests
        run: pnpm --filter @shotledger/backend test

      # The photo-scoring CV on synthetic photos with known holes (#864): about
      # a minute, so outside `pnpm check`. Real photos stay with the local
      # tools/cv/eval runs.
      - name: CV regression (synthetic photos)
        run: pnpm cv:regression

      # Requirement↔test traceability (docs/reqstool/README.md). `pnpm check` has already run
      # both test suites, so the JUnit results reqstool matches against are on
      # disk by now. Kept out of `pnpm check` itself because the client is
      # Python, same as the docs gates.
      - uses: actions/setup-python@v7.1.0
        with:
          # 3.14 until pygit2 (a reqstool dependency) ships 3.15 wheels; on 3.15
          # pip builds it from source and fails without the libgit2 headers.
          python-version: '3.14.8'
          # pipx installs through pip, so its wheel cache serves reqstool too.
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      # --python is load-bearing: pipx builds its venv with the interpreter pipx
      # itself was installed with (system 3.12 on ubuntu-latest), not with the
      # one setup-python put on PATH — and reqstool is Requires-Python >=3.13,
      # so without this the step fails with "No matching distribution found".
      - name: Install the reqstool client
        run: pipx install --python "$pythonLocation/bin/python" reqstool==0.12.2

      # Licence and copyright for every file (REUSE 3.3, REUSE.toml), #100.
      - name: Install the REUSE tool
        run: pipx install --python "$pythonLocation/bin/python" reuse==6.2.0

      - name: Check every file's licence and copyright (REUSE)
        run: reuse lint

      - name: Collect requirement annotations
        run: pnpm reqstool:tags

      - name: Check every requirement is implemented and verified
        run: pnpm reqstool:status
