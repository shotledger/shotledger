name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
