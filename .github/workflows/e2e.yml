name: E2E

# The Maestro flows in app/e2e on an Android emulator (#806). An emulator run
# costs several times the minutes of `check`, so it runs only on pushes to
# main that can change the app, on PRs labelled `e2e`, and by hand. A PR
# without the label still triggers the workflow, but the job is skipped, and
# a skipped job costs no minutes.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/src/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Several merges in a row need only the last one checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    # The one job that ignores CI_RUNNER: the emulator needs KVM and the
    # Gradle build about 8 GB of RAM, which GitHub's ubuntu-latest provides.
    # Untested on Blacksmith's 2-vCPU runner, so switching CI there leaves
    # this job on GitHub's minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner image ships JDK 21, the version the Android build uses
      # (run-app skill); it is just not the default.
      - name: Use JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Restored here, saved after the build even when it fails or times out:
      # a cold run spends about 6 minutes downloading dependencies, and with
      # a plain actions/cache a failed run never saved anything, so every
      # retry started cold. An exact hit skips the save.
      - uses: actions/cache/restore@v6.1.0
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ hashFiles('pnpm-lock.yaml', 'app/app.json') }}
          restore-keys: gradle-e2e-

      # The third run built the APK, then the runner vanished while
      # unpacking Maestro, leaving no log: most likely a full disk. The
      # build, its native intermediates, the Gradle cache and node_modules
      # fill most of the runner's free space, so drop toolchains this job
      # never uses (.NET, Haskell, Swift, CodeQL; the Android SDK stays).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Show the runner's size
        run: nproc && free -h

      # A release build bundles the JS, so the flows need no Metro. The dev
      # tools flag opens /dev, where the flows load demo data; never set it
      # for a Play build (app/CLAUDE.md). x86_64 only: the emulator's ABI.
      # The template's 2 GB heap and 512 MB metaspace ran out on the runner
      # and Gradle hung instead of failing (first run, 2026-10-14). A 6 GB
      # heap is most of the runner's RAM, leaving little for Metro and the
      # C++ compilers. So: 4 GB, Kotlin compiled inside Gradle's
      # JVM rather than a second daemon, and no lint pass (CI's `check`
      # lints). A cold build, C++ for every native module included, took
      # over 25 minutes on the second run.
      - name: Build the APK
        id: build
        working-directory: app
        timeout-minutes: 45
        env:
          EXPO_PUBLIC_ENABLE_DEV_TOOLS: '1'
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 \
            -x lintVitalAnalyzeRelease --no-daemon \
            -Pkotlin.compiler.execution.strategy=in-process
          df -h /

      - uses: actions/cache/save@v6.1.0
        if: ${{ always() && steps.build.outcome != 'skipped' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ hashFiles('pnpm-lock.yaml', 'app/app.json') }}

      - name: Install the Maestro CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      # Hardware acceleration for the emulator; without it the flows crawl.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Each script line runs in its own shell, so the directory is set here.
      - name: Run the flows
        id: flows
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # No hardware profile, so the screen is 320x640: flows scroll to
          # what they check. A pixel_6 profile (1080x2400) never showed the
          # app's Home screen in any flow on this runner (2026-10-14).
          disable-animations: true
          working-directory: app
          # The launcher or System UI can hit an ANR on a freshly booted
          # emulator, and its dialog then covers the app for every flow
          # (2026-10-14: all six failed behind "Pixel Launcher isn't
          # responding"). Let the system settle, stop such dialogs showing,
          # and close one that is already up.
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell settings put global hide_error_dialogs 1
            sleep 30
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            adb shell input keyevent KEYCODE_HOME
            maestro test e2e

      # Maestro's screenshots and logs for each failed flow (demo data only).
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() && steps.flows.outcome == 'failure' }}
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          retention-days: 7
