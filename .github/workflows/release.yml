---
name: Release

# The whole release, start to finish, in one self-contained workflow. Modelled
# on Malmo-Skyttegille-Pistolsektionen/revolve_now's release.yml; nothing here
# calls a workflow or action from another repository.
#
#   prepare -> checks -> [approval] -> build on EAS + read the version back
#                                        -> tag + prerelease with the .aab
#                                        -> verify the published asset
#                                        -> promote to latest
#
# The tag is the version. app/package.json holds a 0.0.0 placeholder; the build
# job stamps the resolved version into it, uncommitted, right before
# `eas build`, which uploads the working tree as it is (checked in #623).

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release - bare, full three-part semver: 0.1.0, never 0.1
          or v0.1.0. Empty = auto-detect from the Conventional Commits since the
          last tag.
        required: false
        type: string
        default: ''
      force:
        description: 'Allow a version that disagrees with the auto-detected one.'
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'Preview only: resolve the version and the notes, tag nothing, build nothing.'
        required: false
        type: boolean
        default: true

# No `ref` input: the release is cut from the ref the workflow is dispatched on,
# the only way the called checks are guaranteed to test the commit that gets
# tagged. `prepare` asserts that commit is on main.

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-git-cliff

      - uses: ./.github/actions/check-version
        with:
          version: ${{ inputs.version }}

      - name: Check the ref may be released from
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main)
              if ! git merge-base --is-ancestor "$SHA" origin/main; then
                echo "::error::$SHA is not reachable from origin/main. Merge to main first."
                exit 1
              fi
              ;;
            refs/heads/hotfix/* | refs/heads/release/*)
              ;;
            *)
              echo "::error::Releases are cut from main, hotfix/* or release/* only (got '$REF')."
              exit 1
              ;;
          esac

      - name: Record the previous tag
        id: previous
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PREV="$(git tag --list --merged "$SHA" --sort=-version:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Check the ref is not already released
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXISTING="$(git tag --points-at "$SHA" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | paste -sd' ' - || true)"
          if [ -n "$EXISTING" ]; then
            echo "::error::${SHA:0:12} is already released as '$EXISTING'. Merge new commits first."
            exit 1
          fi

      - name: Resolve the version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          # cliff.toml reads commit.remote.*, so git-cliff calls the GitHub API
          # even for --bumped-version; unauthenticated it rate-limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            # No release tag yet: the first release is a deliberate number.
            AUTO="0.1.0"
          else
            AUTO="$(git-cliff --config .github/cliff.toml --bumped-version)"
          fi

          if [ -z "$REQUESTED" ]; then
            VERSION="$AUTO"
            if [ "$VERSION" = "$PREVIOUS" ]; then
              echo "::error::Nothing to release: no commit since '$PREVIOUS' earns a version bump."
              echo "::error::Pass a version explicitly with force if you really do want to ship them."
              exit 1
            fi
          else
            VERSION="$REQUESTED"
            if [ "$VERSION" != "$AUTO" ]; then
              if [ "$FORCE" != "true" ]; then
                echo "::error::Version '$VERSION' disagrees with the auto-detected '$AUTO'."
                echo "::error::Re-run with force enabled if that is deliberate."
                exit 1
              fi
              echo "::warning::Forcing '$VERSION' over the auto-detected '$AUTO'."
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/check-version
        with:
          version: ${{ steps.resolve.outputs.version }}

      - name: Check the tag is free
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag '$VERSION' already exists. Releases are immutable; pick the next version."
            exit 1
          fi

      # Generated here and handed downstream, so the notes approved at the gate
      # are provably the notes that ship.
      - name: Generate the release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --config .github/cliff.toml --latest --unreleased --strip all --output NOTES.md

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: NOTES.md
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then MODE="dry run - nothing built, tagged or published"; else MODE="checks, approval, build, tag, prerelease, verify, promote"; fi
          {
            echo "### Release ${VERSION:-(unresolved)}"
            echo ""
            echo "| | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION:-(unresolved)}\` |"
            echo "| Previous tag | \`${PREVIOUS:-(none yet)}\` |"
            echo "| Ref | \`$REF\` @ \`${SHA:0:12}\` |"
            echo "| Mode | $MODE |"
            echo ""
            echo "#### Release notes"
            echo ""
            cat NOTES.md 2>/dev/null || echo "_(not generated - an earlier step failed)_"
            echo ""
            echo "<details><summary>Commits since \`${PREVIOUS:-the beginning}\`</summary>"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              git log "${PREVIOUS}..${SHA}" --format="- %h %s"
            else
              # -n, not | head: head closing the pipe makes git exit 141 under pipefail.
              git log "$SHA" -n 40 --format="- %h %s"
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same checks that guard pull requests, at the commit being released, and
  # before the approval gate, so the reviewer approves something already green.
  checks:
    name: checks
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # THE APPROVAL GATE, and the only job that builds what ships.
  #
  # !! Advisory on this plan: a private repo on GitHub Free cannot have a
  # required reviewer (the API answers 422), so the `release` environment has
  # no protection rules and this job runs straight through. Add the maintainer
  # as required reviewer once the repo is public or on Pro (#100).
  build:
    name: build on EAS
    needs: [prepare, checks]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Uncommitted on purpose: the tree keeps the 0.0.0 placeholder, and EAS
      # uploads the working tree with this edit in it.
      - name: Stamp the version
        working-directory: app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=$VERSION"

      - uses: expo/expo-github-action@9.0.0
        with:
          eas-version: 24.12.0
          token: ${{ secrets.EXPO_TOKEN }}

      # --wait: the job holds the runner until EAS finishes, because everything
      # after this needs the built .aab. The free tier's queue can be long.
      - name: Build the Play bundle
        working-directory: app
        run: eas build --platform android --profile production --non-interactive --wait --json > ../build.json

      # The real assertion: read the version and commit back from what EAS
      # built rather than trusting that the stamp reached it.
      - name: Assert the build carries the version and commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILT="$(jq -r '.[0].appVersion' build.json)"
          COMMIT="$(jq -r '.[0].gitCommitHash' build.json)"
          STATUS="$(jq -r '.[0].status' build.json)"
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::EAS build ended '$STATUS'."
            exit 1
          fi
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::EAS built version '$BUILT', not '$VERSION' - refusing to release."
            exit 1
          fi
          if [ "$COMMIT" != "$SHA" ]; then
            echo "::error::EAS built commit '$COMMIT', not '$SHA' - refusing to release."
            exit 1
          fi
          echo "EAS built $BUILT at ${COMMIT:0:12}"

      - name: Download and checksum the bundle
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          URL="$(jq -r '.[0].artifacts.applicationArchiveUrl' build.json)"
          curl -fsSL -o "release/shotledger-${VERSION}.aab" "$URL"
          cd release
          sha256sum ./*.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "sha256=$(sha256sum "shotledger-${VERSION}.aab" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error

  publish:
    name: push the tag and create the prerelease
    needs: [prepare, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release

      - name: Check the tag is still free
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      # persist-credentials: false leaves origin unauthenticated; push to an
      # explicit tokenised URL rather than storing one in .git/config.
      - name: Create and push the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a -m "$VERSION" "$VERSION" "$SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$VERSION"

      # A prerelease, so a failed verification never becomes /releases/latest;
      # the asset goes in with `create`, so the release never exists without it.
      - name: Create the prerelease with its assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file NOTES.md \
            --prerelease \
            "release/shotledger-$VERSION.aab" \
            release/SHA256SUMS.txt)
          echo "### Prerelease created: \`$VERSION\` - $URL" >> "$GITHUB_STEP_SUMMARY"

  # Downloads what was published and checks it against what was built: the
  # build proved the build, this proves the upload.
  verify:
    name: verify the published asset
    needs: [prepare, build, publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and verify
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AAB_SHA256: ${{ needs.build.outputs.sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$VERSION" --repo "$REPO" --dir dl
          cd dl
          sha256sum -c SHA256SUMS.txt
          echo "${AAB_SHA256}  shotledger-${VERSION}.aab" | sha256sum -c -

  promote:
    name: promote to latest
    needs: [prepare, verify]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the prerelease
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --repo "$REPO" --prerelease=false --latest
          echo "### Released: \`$VERSION\` is now the latest release." >> "$GITHUB_STEP_SUMMARY"
