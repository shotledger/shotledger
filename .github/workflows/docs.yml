name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/manual/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys are serialised; a queued run finishes rather than being
# cancelled, so the published site always matches a completed build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      # The same gate contributors run locally. `--strict` fails the build on a
      # broken internal link, so a bad cross-reference never reaches the site —
      # and it runs on pull requests, where it is cheap to fix.
      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: site

  deploy:
    # Only from main. A pull request gets the strict build above as a gate and
    # nothing else — a PR must never be able to replace the published site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
