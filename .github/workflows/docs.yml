name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/manual/**'
      - 'docs/requirements.txt'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Only the deploy below needs serializing; a superseded build is waste.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The translation check compares git commit times, so it needs more
          # than the default single commit.
          fetch-depth: 0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.1'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      # The two checks below are Node scripts; run them on the repo's Node,
      # not whatever the runner image ships.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      # `--strict` cannot see a translation that has fallen behind its English
      # source: stale Swedish is valid markdown. This can, and it needs the git
      # history, hence fetch-depth 0 on the checkout above.
      - name: Check translations are not stale
        run: node scripts/docs-translation-check.mjs

      # `--strict` does not cover anchors either: a link to a heading that no
      # longer exists is logged at INFO and the build still exits 0.
      - name: Check for dangling anchors
        run: node scripts/docs-anchor-check.mjs

      # The same gate contributors run locally. `--strict` fails the build on a
      # broken internal link, so a bad cross-reference never reaches the site —
      # and it runs on pull requests, where it is cheap to fix.
      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    # Only from main. A pull request gets the strict build above as a gate and
    # nothing else — a PR must never be able to replace the published site.
    # GitHub Free covers Pages for public repositories only, so the deploy is
    # skipped rather than failing if the repo is ever private again (#386).
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      github.event.repository.visibility == 'public'
    name: Publish to GitHub Pages
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Pages deploys are serialized; a queued run finishes rather than being
    # canceled, so the published site always matches a completed build.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
