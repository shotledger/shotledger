name: CI cache

# CI runs on pull requests only, and a cache saved by one PR is invisible to
# every other PR. Caches saved here, on main, are the ones every PR restores.
# The setup steps mirror ci.yml so the cache keys match.
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - .github/workflows/ci.yml
      - .github/workflows/ci-cache.yml
  # Keeps the prettier cache close to main between lockfile changes.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install the reqstool client
        run: pipx install --python "$pythonLocation/bin/python" reqstool==0.12.2

      - run: pnpm format

      - uses: actions/cache/save@v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ github.run_id }}
