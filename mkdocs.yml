# MkDocs configuration for the ShotLedger user manual.
#
# Local build (must pass before any PR that touches docs/manual):
#
#   pip install -r docs/requirements.txt
#   mkdocs build --strict
#
# `--strict` turns broken internal links and nav warnings into build failures,
# which is what makes this usable as a gate.
#
# NOT versioned with mike, unlike skillsgateway. Versioned docs exist to let a
# reader pick the manual matching the release they run; ShotLedger has not
# released, and every reader is on the newest build. Add mike at the first
# release, not before.

site_name: ShotLedger
site_description: >-
  A free target-shooting logbook for SPSF pistol shooters — log sessions shot by
  shot, score paper targets from a photograph, and keep the range activity your
  licence renewal needs.
site_url: https://jimisola.github.io/shotledger/
repo_url: https://github.com/jimisola/shotledger
repo_name: jimisola/shotledger
edit_uri: edit/main/docs/manual/
copyright: Free and open source. Donations unlock nothing.

# docs/ already holds the material the app's contributors and agents work from —
# ADRs, specs, the implementation plan. The user manual is a different audience
# and gets its own clean directory rather than taking over docs/ wholesale.
docs_dir: docs/manual

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    # navigation.instant is deliberately absent: it is incompatible with the
    # language switcher's contextual link, which is what makes "switch to
    # Swedish" land on the SAME page rather than on the Swedish home page.
    # Staying where you are matters more than SPA-style page loads.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  # i18n must come BEFORE search: it registers the per-language file set that
  # search then indexes, and the plugin's own docs are explicit about the order.
  - i18n:
      docs_structure: suffix
      # A page with no `.sv.md` serves the English one rather than 404ing, so
      # the translation can land page by page instead of as one 15-file commit.
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: sv
          name: Svenska
          build: true
          site_description: >-
            En fri skytteloggbok för pistolskyttar — logga pass skott för skott,
            räkna tavlor från ett foto och håll den skjutaktivitet som
            licensförnyelsen kräver.
          nav_translations:
            Home: Start
            Getting started: Kom igång
            Guides: Guider
            Regulations: Reglementen
            Logging a session: Logga ett pass
            Scoring from a photo: Räkna från foto
            Timers: Timers
            Firearms and ammunition: Vapen och ammunition
            Licence activity: Skjutaktivitet
            External sites: Externa webbplatser
            Webshooter: Webshooter
            The Vault: Valvet
            Exporting sessions: Exportera pass
            Backup and restore: Säkerhetskopiering
            Reference: Referens
            Vapengrupp and klass: Vapengrupp och klass
            Glossary: Ordlista
            Your data and privacy: Dina data och integritet
  - search:
      lang:
        - en
        - sv

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Regulations: guides/regulations.md
      - Logging a session: guides/logging-a-session.md
      - Scoring from a photo: guides/scoring-from-a-photo.md
      - Timers: guides/timers.md
      - Firearms and ammunition: guides/firearms-and-ammunition.md
      - Licence activity: guides/licence-activity.md
      - Webshooter: guides/webshooter.md
      - The Vault: guides/vault.md
      - Exporting sessions: guides/exporting-sessions.md
      - Backup and restore: guides/backup-and-restore.md
  - Reference:
      - Vapengrupp and klass: reference/vapengrupp-and-klass.md
      - Glossary: reference/glossary.md
      - Your data and privacy: reference/privacy.md
