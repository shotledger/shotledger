packages:
  - app
  - shared
  - backend
  - web
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - globals@17.12.0
  - '@jest/console@30.5.1'
  - '@jest/core@30.5.1'
  - '@jest/environment@30.5.1'
  - '@jest/expect-utils@30.5.1'
  - '@jest/expect@30.5.1'
  - '@jest/fake-timers@30.5.1'
  - '@jest/globals@30.5.1'
  - '@jest/reporters@30.5.1'
  - '@jest/snapshot-utils@30.5.1'
  - '@jest/test-result@30.5.1'
  - '@jest/test-sequencer@30.5.1'
  - '@jest/transform@30.5.1'
  - '@jest/types@30.5.1'
  - babel-jest@30.5.1
  - expect@30.5.1
  - jest-changed-files@30.5.1
  - jest-circus@30.5.1
  - jest-cli@30.5.1
  - jest-config@30.5.1
  - jest-diff@30.5.1
  - jest-each@30.5.1
  - jest-environment-node@30.5.1
  - jest-haste-map@30.5.1
  - jest-leak-detector@30.5.1
  - jest-matcher-utils@30.5.1
  - jest-message-util@30.5.1
  - jest-mock@30.5.1
  - jest-resolve-dependencies@30.5.1
  - jest-resolve@30.5.1
  - jest-runner@30.5.1
  - jest-runtime@30.5.1
  - jest-snapshot@30.5.1
  - jest-util@30.5.1
  - jest-validate@30.5.1
  - jest-watcher@30.5.1
  - jest-worker@30.5.1
  - jest@30.5.1
  - pretty-format@30.5.1
  - expo-sharing@57.0.17
  - expo-secure-store@57.0.3
patchedDependencies:
  # Vitest 5 matches testNamePattern against the suite chain joined with ' > ',
  # but the runner still builds test ids and the filter regex with a single
  # space, so every mutant run selects zero tests and survives. Upstream:
  # stryker-mutator/stryker-js#6210. Drop this when a release carries the fix.
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
  eslint-plugin-react-native@5.0.0: patches/eslint-plugin-react-native@5.0.0.patch
  # The web sync channel writes its result length through Uint8Array#set,
  # keeping only `length % 256`, so any sync result over 255 bytes is
  # truncated. Mirrors upstream expo/expo#44148 (ADR 0012); drop this when a
  # release carries the fix.
  expo-sqlite@57.0.3: patches/expo-sqlite@57.0.3.patch
overrides:
  qs: 6.16.0
  decode-uri-component: 0.5.0
  uuid: 14.0.2
  esbuild: 0.28.2
